name: Deploy to FastPanel

on:
  push:
    branches:
      - master

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build on CI and deploy artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma migrations via SSH tunnel
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL не задан — миграции пропущены"
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -f -N -L 3307:127.0.0.1:3306 \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST"

          cleanup() {
            pkill -f "ssh -f -N -L 3307:127.0.0.1:3306" 2>/dev/null || true
          }
          trap cleanup EXIT

          sleep 3

          set +e
          OUTPUT="$(npx prisma migrate deploy 2>&1)"
          CODE=$?
          set -e
          echo "$OUTPUT"

          if [ "$CODE" -ne 0 ] && echo "$OUTPUT" | grep -q "P3005"; then
            echo "==> P3005: baseline старых миграций"
            npx prisma migrate resolve --applied 20260530133049_init
            npx prisma migrate resolve --applied 20260530150840_required_email_message
            npx prisma migrate deploy
          elif [ "$CODE" -ne 0 ]; then
            echo "ОШИБКА миграций, код $CODE"
            exit "$CODE"
          fi

      - name: Build Nuxt
        run: npm run build

      - name: Install Nitro server dependencies
        run: |
          cd .output/server
          rm -rf node_modules package-lock.json
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (const section of ['dependencies', 'optionalDependencies', 'devDependencies']) {
            if (!pkg[section]) continue;
            for (const name of Object.keys(pkg[section])) {
              if (/musl/i.test(name)) delete pkg[section][name];
            }
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          NODE
          npm install --omit=dev --no-package-lock

      - name: Pack build artifact
        run: |
          tar -czf deploy.tar.gz .output
          ls -lh deploy.tar.gz

      - name: Upload and deploy on server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: deploy.tar.gz
          target: ${{ secrets.DEPLOY_PATH }}
          timeout: 30m

      - name: Activate release on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -ex
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin master
            git checkout master 2>/dev/null || git checkout -b master
            git reset --hard origin/master
            chmod +x scripts/deploy-remote.sh
            bash scripts/deploy-remote.sh "${{ secrets.DEPLOY_PATH }}"
